name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create a GitHub Release

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── BuildStream setup ────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install BuildStream and plugins
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap debootstrap
          pip install -r requirements.txt

      # ── Build environment ─────────────────────────────────────────────────
      - name: Create Ubuntu base and SDK rootfs
        run: sudo bash scripts/create-sdk.sh

      - name: Fix ownership of generated directories
        run: sudo chown -R "$USER:$USER" files/

      # ── Source refs ──────────────────────────────────────────────────────
      - name: Compute QEMU tarball SHA-256 ref
        run: python3 scripts/fetch-refs.py

      - name: Track CPython git ref
        run: bst source track elements/components/python3.bst

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build system image
        run: bst build elements/image/system.bst

      # ── Artifact ─────────────────────────────────────────────────────────
      - name: Check out assembled image
        run: |
          mkdir -p output
          bst artifact checkout elements/image/system.bst --directory output/

      - name: Create release tarball and checksum
        run: |
          TAG="${GITHUB_REF_NAME}"
          tar -czf "minimal-linux-${TAG}.tar.gz" -C output .
          sha256sum "minimal-linux-${TAG}.tar.gz" > "minimal-linux-${TAG}.tar.gz.sha256"
          echo "ASSET=minimal-linux-${TAG}.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_SHA=minimal-linux-${TAG}.tar.gz.sha256" >> "$GITHUB_ENV"

      # ── GitHub Release ────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Minimal Linux ${{ github.ref_name }}"
          body: |
            ## Minimal Linux ${{ github.ref_name }}

            Minimal Linux distribution based on Ubuntu 24.04 with:
            - **Python 3.12** – built from source (CPython)
            - **QEMU 9.0** – built from source (x86_64 system + user-mode emulation)

            Built with [BuildStream](https://buildstream.build/) orchestrator.

            ### Installation
            ```bash
            tar -xzf minimal-linux-${{ github.ref_name }}.tar.gz -C /mnt/rootfs
            ```

            ### Verify integrity
            ```bash
            sha256sum -c minimal-linux-${{ github.ref_name }}.tar.gz.sha256
            ```
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
