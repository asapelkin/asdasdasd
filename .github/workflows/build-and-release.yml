name: Build and Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install BuildStream
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildstream

      - name: Build image element
        run: bst build image.bst

      - name: Checkout built artifact
        run: |
          mkdir -p out
          bst artifact checkout image.bst --directory out/rootfs
          tar -C out/rootfs -czf out/ubuntu-mini-poc-rootfs.tar.gz .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-mini-poc-rootfs
          path: out/ubuntu-mini-poc-rootfs.tar.gz

      - name: Publish GitHub release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/ubuntu-mini-poc-rootfs.tar.gz
