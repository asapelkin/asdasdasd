name: minimal-linux
min-version: 2.0

# Element definitions are in the elements/ directory
element-path: elements

# All source refs are stored centrally in project.refs
# - Git refs:  bst source track elements/components/python3.bst
# - Tar refs:  python3 scripts/fetch-refs.py
ref-storage: project.refs

# URL aliases for download locations
aliases:
  github: https://github.com/
  qemu-dl: https://download.qemu.org/

# BuildStream plugins provided by the buildstream-plugins pip package
plugins:
  - origin: pip
    package-name: buildstream-plugins
    elements:
      - autotools
      - meson
    sources:
      - git

# Default sandbox options
sandbox:
  build-uid: 0
  build-gid: 0
